<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle}">練習記録フォーム</title>
</head>
<body>
  <h1 th:text="${pageTitle}">練習記録フォーム</h1>

  <p><a th:href="@{/sessions}">一覧へ戻る</a></p>

  <form th:action="@{${formAction}}" th:object="${trainingSessionForm}" method="post">
    <div>
      <label>開始日時</label>
      <input type="datetime-local" th:field="*{startAt}">
      <div th:if="${#fields.hasErrors('startAt')}" th:errors="*{startAt}"></div>
    </div>

    <div>
      <label>終了日時</label>
      <input type="datetime-local" th:field="*{endAt}">
      <div th:if="${#fields.hasErrors('endAt')}" th:errors="*{endAt}"></div>
    </div>

    <div>
      <label>タイトル</label>
      <input type="text" th:field="*{title}">
      <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
    </div>

    <div>
      <label>メモ</label><br>
      <textarea th:field="*{notes}" rows="5" cols="40"></textarea>
      <div th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
    </div>

    <div>
      <button type="submit">保存</button>
    </div>
  </form>
</body>
</html>
