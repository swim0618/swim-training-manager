<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>練習記録詳細</title>
</head>
<body>
  <h1>練習記録詳細</h1>

  <p><a th:href="@{/sessions}">一覧へ戻る</a></p>

  <p>ID: <span th:text="${session.id}"></span></p>
  <p>タイトル: <span th:text="${session.title}"></span></p>
  <p>開始日時: <span th:text="${session.startAt}"></span></p>
  <p>終了日時: <span th:text="${session.endAt}"></span></p>
  <p>メモ: <span th:text="${session.notes}"></span></p>

  <h2>セット件数</h2>
  <p th:text="${#lists.size(sets)}"></p>
</body>
</html>
