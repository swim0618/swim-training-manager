<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>練習記録一覧</title>
</head>
<body>
  <h1>練習記録一覧</h1>

  <p>
    <a th:href="@{/top}">トップへ戻る</a> |
    <a th:href="@{/sessions/new}">新規登録</a>
  </p>

  <table border="1">
    <thead>
      <tr>
        <th>開始日時</th>
        <th>終了日時</th>
        <th>タイトル</th>
        <th>メモ</th>
        <th>詳細</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="session : ${sessions}">
        <td th:text="${#temporals.format(session.startAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${session.endAt != null ? #temporals.format(session.endAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
        <td th:text="${session.title}"></td>
        <td th:text="${session.notes}"></td>
        <td><a th:href="@{/sessions/{id}(id=${session.id})}">詳細</a></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
