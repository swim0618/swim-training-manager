<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle}">セットフォーム</title>
</head>
<body>
  <h1 th:text="${pageTitle}">セットフォーム</h1>

  <p>
    <a th:href="@{/sessions/{id}(id=${sessionId})}">練習記録詳細へ戻る</a>
  </p>

  <form th:action="@{${formAction}}" th:object="${trainingSetForm}" method="post">
    <div>
      <label>順番</label>
      <input type="number" th:field="*{orderNo}">
      <div th:if="${#fields.hasErrors('orderNo')}" th:errors="*{orderNo}"></div>
    </div>

    <div>
      <label>距離(m)</label>
      <input type="number" th:field="*{distanceM}">
      <div th:if="${#fields.hasErrors('distanceM')}" th:errors="*{distanceM}"></div>
    </div>

    <div>
      <label>本数</label>
      <input type="number" th:field="*{reps}">
      <div th:if="${#fields.hasErrors('reps')}" th:errors="*{reps}"></div>
    </div>

    <div>
      <label>インターバル(秒)</label>
      <input type="number" th:field="*{intervalSec}">
      <div th:if="${#fields.hasErrors('intervalSec')}" th:errors="*{intervalSec}"></div>
    </div>

    <div>
      <label>泳法</label>
      <select th:field="*{stroke}">
        <option value="">選択してください</option>
        <option th:each="stroke : ${strokeTypes}"
                th:value="${stroke}"
                th:text="${stroke}">
        </option>
      </select>
    </div>

    <div>
      <label>強度</label>
      <select th:field="*{intensity}">
        <option value="">選択してください</option>
        <option th:each="intensity : ${intensityTypes}"
                th:value="${intensity}"
                th:text="${intensity}">
        </option>
      </select>
    </div>

    <div>
      <label>メモ</label><br>
      <textarea th:field="*{memo}" rows="5" cols="40"></textarea>
      <div th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}"></div>
    </div>

    <div>
      <button type="submit">保存</button>
    </div>
  </form>
</body>
</html>
